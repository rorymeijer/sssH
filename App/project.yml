# XcodeGen spec for the sssh app.
#
# The project file is generated rather than committed: a .pbxproj is unreadable
# in review and merges badly, and this is the same information in a form a
# person can actually check. Regenerate after changing anything here:
#
#     brew install xcodegen
#     cd App && xcodegen generate
#
# The transport stack stays in SwiftPM at the repository root so that it can be
# built and tested on Linux in CI; this project consumes it as a local package.
name: sssh
options:
  bundleIdPrefix: nl.rorymeijer
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  sssh:
    path: ..
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # Pinned to the last tagged release. `main` is a 2.x rewrite with a
    # different view API (no `getTerminal()`, a reworked delegate); moving to it
    # is a deliberate step, not something to pick up by drifting.
    exactVersion: 1.20.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: nl
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic

targets:
  sssh:
    type: application
    platform: [macOS, iOS]
    sources:
      - path: Sources/ssshApp
    dependencies:
      - package: sssh
        product: ssshCore
      - package: sssh
        product: ssshTransportNIOSSH
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.rorymeijer.sssh
        PRODUCT_NAME: sssh
        INFOPLIST_KEY_CFBundleDisplayName: sssh
        # Dutch first, English as the fallback locale.
        INFOPLIST_KEY_CFBundleLocalizations: nl en
        SWIFT_STRICT_CONCURRENCY: targeted
      macOS:
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Outgoing connections only. No incoming server, no camera, no
        # microphone, no address book: an SSH client needs none of it, and the
        # entitlements file is where that gets enforced rather than promised.
        CODE_SIGN_ENTITLEMENTS: Sources/ssshApp/Resources/sssh.macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
      iOS:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
